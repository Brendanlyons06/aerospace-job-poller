name: AeroScout Daily Subscriber Digest

on:
  schedule:
    # GitHub schedules use UTC. These redundant windows cover 9 AM Pacific
    # during both daylight and standard time. A run before 9 AM is a safe
    # no-op because the database only returns subscriptions that are due.
    - cron: "17 16 * * *"
    - cron: "47 16 * * *"
    - cron: "17 17 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:

concurrency:
  group: aeroscout-daily-subscriber-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB_POLLER_PROFILE: aerospace
      JOB_POLLER_REQUIRE_POSTGRES: "true"
      JOB_POLLER_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      EMAIL_ALERTS_ENABLED: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PUBLIC_SUBSCRIPTIONS_ENABLED: "true"
      AEROSCOUT_PUBLIC_URL: https://aeroscout-internships.brendanlyons07.chatgpt.site

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          path: job-poller

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-poller/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r job-poller/requirements.txt

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$JOB_POLLER_DATABASE_URL" ]; then
            echo "Missing SUPABASE_DATABASE_URL"
            exit 1
          fi
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$EMAIL_TO" ]; then
            echo "Missing one or more email secrets: SMTP_USER, SMTP_PASSWORD, EMAIL_TO"
            exit 1
          fi

      - name: Send due subscriber digests
        run: python -m job-poller.send_due_digests
